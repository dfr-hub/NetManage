[V200R010C10SPC600]
#
 sysname R4-HUAWEI
#
 dns resolve
 dns server 8.8.8.8
 dns domain lab.local
#
vlan batch 40 41 to 42
#
vlan 40
 name FINANCE
#
aaa
 local-user admin password irreversible-cipher $1a$synthetic$
 local-user admin privilege level 15
#
interface GigabitEthernet0/0/0
 description TO-R3-MIKROTIK
 undo shutdown
 ip address 10.0.34.2 255.255.255.252
 ospf cost 20
#
interface GigabitEthernet0/0/1
 description TO-R5-FORTINET
 undo shutdown
 ip address 10.0.45.1 255.255.255.252
 traffic-filter inbound acl 3000
 traffic-policy WAN-QOS outbound
#
interface GigabitEthernet0/0/2
 description LAN-TRUNK
 undo shutdown
#
interface GigabitEthernet0/0/2.40
 description LAN-FINANCE
 dot1q termination vid 40
 ip address 192.168.4.1 255.255.255.0
 arp broadcast enable
#
interface GigabitEthernet0/0/3
 description UNUSED
 shutdown
#
interface LoopBack0
 ip address 10.255.0.4 255.255.255.255
#
ospf 1 router-id 10.255.0.4
 silent-interface GigabitEthernet0/0/2.40
 import-route static
 area 0.0.0.0
  network 10.255.0.4 0.0.0.0
  network 10.0.34.0 0.0.0.3
  network 10.0.45.0 0.0.0.3
  network 192.168.4.0 0.0.0.255
#
ip ip-prefix NM-POLICY-SAMPLE index 10 permit 192.168.4.0 24
ip ip-prefix LAN4 index 10 permit 192.168.4.0 24
ip ip-prefix LAN4 index 20 permit 192.168.40.0 22 greater-equal 24 less-equal 24
ip community-filter basic PARTNER index 10 permit 65005:100
#
route-policy TO-R5 permit node 10
 if-match ip-prefix LAN4
 apply community 65004:10 additive
 apply cost 30
#
route-policy TO-R5 deny node 20
#
route-policy FROM-R5 permit node 10
 if-match community-filter PARTNER
 apply local-preference 250
#
route-policy FROM-R5 permit node 20
#
traffic classifier VOICE operator or
 if-match dscp ef
#
traffic classifier MGMT operator or
 if-match acl 3000
#
traffic behavior VOICE-B
 queue ef bandwidth 1000
#
traffic behavior MGMT-B
 remark dscp cs2
 car cir 2000
#
traffic policy WAN-QOS
 classifier VOICE behavior VOICE-B
 classifier MGMT behavior MGMT-B
#
bgp 65004
 router-id 10.255.0.4
 peer 10.0.45.2 as-number 65005
 peer 10.0.45.2 description EBGP-R5
 #
 ipv4-family unicast
  network 192.168.4.0 255.255.255.0
  peer 10.0.45.2 enable
  peer 10.0.45.2 route-policy FROM-R5 import
  peer 10.0.45.2 route-policy TO-R5 export
#
ip route-static 0.0.0.0 0.0.0.0 10.0.34.1 description DEFAULT
ip route-static 10.99.0.0 255.255.255.0 10.0.45.2 preference 150
ip route-static 172.16.0.0 255.255.0.0 NULL0
#
acl number 3000
 rule 5 permit tcp destination-port eq 22
#
 snmp-agent
 snmp-agent community read public
 snmp-agent sys-info location Jakarta-DC1
 snmp-agent sys-info contact noc@lab.local
 ntp-service unicast-server 192.168.1.10
 info-center loghost 192.168.1.50
#
user-interface vty 0 4
 authentication-mode aaa
#
return
