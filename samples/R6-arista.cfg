! Command: show running-config
! device: R6-ARISTA (DCS-7050SX3, EOS-4.31.2F)
!
hostname R6-ARISTA
dns domain lab.local
ip name-server vrf default 8.8.8.8
!
ntp server 192.168.1.10
logging host 192.168.1.50
!
snmp-server contact noc@lab.local
snmp-server location Jakarta-DC1
snmp-server community public ro
!
username admin privilege 15 role network-admin secret sha512 $6$synthetic$hash
!
vlan 60
   name WAREHOUSE
!
interface Ethernet1
   description TO-R5-FORTINET
   no switchport
   ip address 10.0.56.2/30
!
interface Ethernet2
   description TO-R7-H3C
   no switchport
   ip address 10.0.67.1/30
!
interface Ethernet3
   description TO-R1-CISCO
   no switchport
   ip address 10.0.16.2/30
!
interface Ethernet4
   description PC-WAREHOUSE
   switchport mode access
   switchport access vlan 60
!
interface Ethernet5
   description UPLINK-SW
   switchport mode trunk
   switchport trunk allowed vlan 60,61-62
!
interface Ethernet6
   description UNUSED
   shutdown
!
interface Loopback0
   ip address 10.255.0.6/32
!
interface Vlan60
   description LAN-WAREHOUSE
   ip address 192.168.6.1/24
   ip access-group WAREHOUSE-IN in
   service-policy type qos input WH-IN
!
ip prefix-list NM-POLICY-SAMPLE seq 10 permit 192.168.6.0/24
ip prefix-list WAREHOUSE
   seq 10 permit 192.168.6.0/24
   seq 20 permit 192.168.60.0/22 le 24
!
route-map OSPF-STATIC permit 10
   match ip address prefix-list WAREHOUSE
   set metric 100
   set tag 60
!
ip access-list WAREHOUSE-IN
   10 remark izinkan web dan dns
   20 permit tcp 192.168.6.0/24 any eq www https
   30 permit udp 192.168.6.0/24 host 8.8.8.8 eq domain
   40 deny ip any any log
!
ip access-list standard MGMT-STD
   10 permit 192.168.1.0/24
!
class-map type qos match-any WH-VOICE
   match ip access-group WAREHOUSE-IN
!
policy-map type quality-of-service WH-IN
   class WH-VOICE
      set dscp 46
      police rate 2000 kbps burst-size 128 kbytes
!
ip routing
!
ip route 0.0.0.0/0 10.0.16.1 name DEFAULT
ip route 10.99.0.0/24 10.0.67.2 150
ip route 172.16.0.0/16 Null0
!
router ospf 1
   router-id 10.255.0.6
   passive-interface Vlan60
   network 10.255.0.6/32 area 0.0.0.0
   network 10.0.56.0/30 area 0.0.0.0
   network 10.0.67.0/30 area 0.0.0.0
   network 10.0.16.0/30 area 0.0.0.0
   network 192.168.6.0/24 area 0.0.0.0
   redistribute static route-map OSPF-STATIC
!
management api http-commands
   no shutdown
!
end
