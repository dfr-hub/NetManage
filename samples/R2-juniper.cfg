set version 21.4R3
set system host-name R2-JUNIPER
set system domain-name lab.local
set system name-server 8.8.8.8
set system ntp server 192.168.1.10
set system syslog host 192.168.1.50 any notice
set system login user admin class super-user
set system services ssh
set snmp location "Jakarta-DC1"
set snmp contact "noc@lab.local"
set snmp community public authorization read-only
set interfaces ge-0/0/0 description "TO-R1-CISCO"
set interfaces ge-0/0/0 unit 0 family inet address 10.0.12.2/30
set interfaces ge-0/0/1 description "TO-R3-MIKROTIK"
set interfaces ge-0/0/1 unit 0 family inet address 10.0.23.1/30
set interfaces ge-0/0/2 description "LAN-TRUNK"
set interfaces ge-0/0/2 vlan-tagging
set interfaces ge-0/0/2 unit 20 description "LAN-SERVERS"
set interfaces ge-0/0/2 unit 20 vlan-id 20
set interfaces ge-0/0/2 unit 20 family inet address 192.168.2.1/24
set interfaces ge-0/0/3 description "UNUSED"
set interfaces ge-0/0/3 disable
set interfaces lo0 unit 0 family inet address 10.255.0.2/32
set routing-options router-id 10.255.0.2
set routing-options autonomous-system 65001
set routing-options static route 0.0.0.0/0 next-hop 10.0.12.1
set routing-options static route 172.16.0.0/16 discard
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 metric 10
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.20 passive
set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 10.255.0.2
set protocols bgp group IBGP neighbor 10.255.0.1 description "IBGP-R1"
set security zones security-zone trust interfaces ge-0/0/2.20
set policy-options prefix-list NM-POLICY-SAMPLE 192.168.2.0/24
set policy-options prefix-list LAN-NETS 192.168.2.0/24
set policy-options prefix-list LAN-NETS 192.168.20.0/24
set policy-options community GOLD members 65001:300
set policy-options policy-statement IBGP-OUT term LAN from prefix-list LAN-NETS
set policy-options policy-statement IBGP-OUT term LAN then local-preference 300
set policy-options policy-statement IBGP-OUT term LAN then community add GOLD
set policy-options policy-statement IBGP-OUT term LAN then accept
set policy-options policy-statement IBGP-OUT term BLOCK from route-filter 10.66.0.0/16 orlonger
set policy-options policy-statement IBGP-OUT term BLOCK then reject
set policy-options policy-statement IBGP-OUT then reject
set protocols bgp group IBGP export IBGP-OUT
set firewall family inet filter PROTECT-LAN term ALLOW-WEB from source-address 192.168.2.0/24
set firewall family inet filter PROTECT-LAN term ALLOW-WEB from protocol tcp
set firewall family inet filter PROTECT-LAN term ALLOW-WEB from destination-port 80
set firewall family inet filter PROTECT-LAN term ALLOW-WEB from destination-port 443
set firewall family inet filter PROTECT-LAN term ALLOW-WEB then accept
set firewall family inet filter PROTECT-LAN term ALLOW-DNS from protocol udp
set firewall family inet filter PROTECT-LAN term ALLOW-DNS from destination-port 53
set firewall family inet filter PROTECT-LAN term ALLOW-DNS then accept
set firewall family inet filter PROTECT-LAN term DENY-REST then syslog
set firewall family inet filter PROTECT-LAN term DENY-REST then discard
set interfaces ge-0/0/2 unit 20 family inet filter input PROTECT-LAN
set firewall policer LIMIT-5M if-exceeding bandwidth-limit 5m burst-size-limit 100k
set firewall policer LIMIT-5M then discard
set firewall family inet filter QOS-SERVERS-IN term BULK from destination-port 873
set firewall family inet filter QOS-SERVERS-IN term BULK from protocol tcp
set firewall family inet filter QOS-SERVERS-IN term BULK then policer LIMIT-5M
set firewall family inet filter QOS-SERVERS-IN term BULK then dscp af11
set firewall family inet filter QOS-SERVERS-IN term BULK then accept
set firewall family inet filter QOS-SERVERS-IN term DEFAULT then accept
set interfaces ge-0/0/1 unit 0 family inet filter input QOS-SERVERS-IN
