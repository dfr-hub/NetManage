#
 version 7.1.070, Release 6728P23
#
 sysname R7-H3C
#
 dns server 8.8.8.8
 dns domain lab.local
#
vlan 70
 name ENGINEERING
#
interface LoopBack0
 ip address 10.255.0.7 255.255.255.255
#
interface Vlan-interface70
 description LAN-ENGINEERING
 ip address 192.168.7.1 255.255.255.0
 packet-filter name ENG-IN inbound
 qos apply policy ENG-QOS inbound
#
interface GigabitEthernet1/0/1
 port link-mode route
 description TO-R6-ARISTA
 ip address 10.0.67.2 255.255.255.252
#
interface GigabitEthernet1/0/2
 port link-mode route
 description TO-R8-NOKIA
 ip address 10.0.78.1 255.255.255.252
 ospf cost 30
#
interface GigabitEthernet1/0/3
 port link-mode bridge
 description PC-ENGINEERING
 port access vlan 70
#
interface GigabitEthernet1/0/4
 port link-mode bridge
 description UPLINK-SW
 port link-type trunk
 port trunk permit vlan 70 to 72
#
interface GigabitEthernet1/0/5
 port link-mode route
 description UNUSED
 shutdown
#
ospf 1 router-id 10.255.0.7
 silent-interface Vlan-interface70
 import-route static route-policy OSPF-OUT
 area 0.0.0.0
  network 10.255.0.7 0.0.0.0
  network 10.0.67.0 0.0.0.3
  network 10.0.78.0 0.0.0.3
  network 192.168.7.0 0.0.0.255
#
 ip route-static 0.0.0.0 0 10.0.67.1 description DEFAULT
 ip route-static 10.99.0.0 24 10.0.78.2 preference 150
 ip route-static 172.16.0.0 16 NULL0
#
ip prefix-list NM-POLICY-SAMPLE index 10 permit 192.168.7.0 24
ip prefix-list ENG index 10 permit 192.168.7.0 24
ip prefix-list ENG index 20 deny 0.0.0.0 0 less-equal 32
#
route-policy OSPF-OUT permit node 10
 if-match ip address prefix-list ENG
 apply cost 40
#
acl advanced name ENG-IN
 rule 5 comment tolak telnet
 rule 5 deny tcp destination-port eq 23
 rule 10 permit ip source 192.168.7.0 0.0.0.255
#
traffic classifier ENG-DATA operator or
 if-match acl name ENG-IN
#
traffic behavior ENG-DATA-B
 car cir 10000
 remark dscp af21
#
qos policy ENG-QOS
 classifier ENG-DATA behavior ENG-DATA-B
#
acl advanced 3000
 rule 5 permit tcp destination-port eq 22
#
 snmp-agent
 snmp-agent community read public
 snmp-agent sys-info location Jakarta-DC1
 snmp-agent sys-info contact noc@lab.local
 ntp-service enable
 ntp-service unicast-server 192.168.1.10
 info-center loghost 192.168.1.50
#
local-user admin class manage
 password hash $h$6$synthetic
 service-type ssh
#
line vty 0 63
 authentication-mode scheme
#
return
