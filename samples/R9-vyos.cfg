set system host-name 'R9-VYOS'
set system domain-name 'lab.local'
set system name-server '8.8.8.8'
set system login user admin authentication encrypted-password '$6$synthetic$hash'
set system syslog host 192.168.1.50 facility all level 'info'
set service ntp server '192.168.1.10'
set service ssh port '22'
set service snmp community public authorization 'ro'
set service snmp location 'Jakarta-DC1'
set service snmp contact 'noc@lab.local'
set interfaces ethernet eth0 address '10.0.89.2/30'
set interfaces ethernet eth0 description 'TO-R8-NOKIA'
set interfaces ethernet eth1 address '10.0.90.1/30'
set interfaces ethernet eth1 description 'TO-R10-ARUBA'
set interfaces ethernet eth2 description 'LAN-TRUNK'
set interfaces ethernet eth2 vif 90 address '192.168.9.1/24'
set interfaces ethernet eth2 vif 90 description 'LAN-SALES'
set interfaces ethernet eth3 description 'UNUSED'
set interfaces ethernet eth3 disable
set interfaces dummy dum0 address '10.255.0.9/32'
set protocols static route 0.0.0.0/0 next-hop 10.0.89.1
set protocols static route 10.99.0.0/24 next-hop 10.0.90.2 distance '150'
set protocols static route 172.16.0.0/16 blackhole
set protocols ospf parameters router-id '10.255.0.9'
set protocols ospf interface dum0 area '0'
set protocols ospf interface dum0 passive
set protocols ospf interface eth0 area '0'
set protocols ospf interface eth1 area '0'
set protocols ospf interface eth1 cost '40'
set protocols ospf interface eth2.90 area '0'
set protocols ospf interface eth2.90 passive
set protocols bgp system-as '65009'
set protocols bgp parameters router-id '10.255.0.9'
set protocols bgp neighbor 10.0.89.1 remote-as '65008'
set protocols bgp neighbor 10.0.89.1 description 'EBGP-R8'
set protocols bgp neighbor 10.0.89.1 address-family ipv4-unicast
set protocols bgp address-family ipv4-unicast network 192.168.9.0/24
set firewall ipv4 input filter default-action 'accept'
set policy prefix-list NM-POLICY-SAMPLE rule 10 action 'permit'
set policy prefix-list NM-POLICY-SAMPLE rule 10 prefix '192.168.9.0/24'
set policy prefix-list SALES rule 10 action 'permit'
set policy prefix-list SALES rule 10 prefix '192.168.9.0/24'
set policy prefix-list SALES rule 20 action 'permit'
set policy prefix-list SALES rule 20 prefix '192.168.90.0/23'
set policy prefix-list SALES rule 20 le '24'
set policy route-map TO-R8 rule 10 action 'permit'
set policy route-map TO-R8 rule 10 match ip address prefix-list 'SALES'
set policy route-map TO-R8 rule 10 set as-path prepend '65009 65009 65009'
set policy route-map TO-R8 rule 20 action 'deny'
set protocols bgp neighbor 10.0.89.1 address-family ipv4-unicast route-map export 'TO-R8'
set firewall ipv4 name SALES-IN default-action 'drop'
set firewall ipv4 name SALES-IN rule 10 action 'accept'
set firewall ipv4 name SALES-IN rule 10 state 'established'
set firewall ipv4 name SALES-IN rule 10 protocol 'tcp'
set firewall ipv4 name SALES-IN rule 20 action 'accept'
set firewall ipv4 name SALES-IN rule 20 protocol 'tcp'
set firewall ipv4 name SALES-IN rule 20 destination port '80,443'
set firewall ipv4 name SALES-IN rule 20 description 'web keluar'
set firewall ipv4 name SALES-IN rule 30 action 'drop'
set firewall ipv4 name SALES-IN rule 30 log
set firewall ipv4 forward filter rule 100 action 'jump'
set firewall ipv4 forward filter rule 100 jump-target 'SALES-IN'
set firewall ipv4 forward filter rule 100 inbound-interface name 'eth2.90'
set qos policy shaper WAN-SHAPER bandwidth '100mbit'
set qos policy shaper WAN-SHAPER class 10 description 'VOIP'
set qos policy shaper WAN-SHAPER class 10 match VOIP ip dscp 'ef'
set qos policy shaper WAN-SHAPER class 10 bandwidth '2000kbit'
set qos policy shaper WAN-SHAPER class 10 priority '7'
set qos policy shaper WAN-SHAPER class 20 description 'BULK'
set qos policy shaper WAN-SHAPER class 20 match BULK ip destination port '873'
set qos policy shaper WAN-SHAPER class 20 match BULK ip protocol 'tcp'
set qos policy shaper WAN-SHAPER class 20 bandwidth '1000kbit'
set qos policy shaper WAN-SHAPER class 20 ceiling '5000kbit'
set qos policy shaper WAN-SHAPER default bandwidth '50%'
set qos interface eth1 egress 'WAN-SHAPER'
