#config-version=FGT100F-7.4.4-FW-build2662-240514:opmode=0:vdom=0
config system global
    set hostname "R5-FORTINET"
    set timezone 53
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.45.2 255.255.255.252
        set allowaccess ping ssh
        set description "TO-R4-HUAWEI"
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.56.1 255.255.255.252
        set allowaccess ping
        set description "TO-R6-ARISTA"
    next
    edit "port3"
        set vdom "root"
        set description "LAN-TRUNK"
    next
    edit "port4"
        set vdom "root"
        set description "UNUSED"
        set status down
    next
    edit "vlan50"
        set vdom "root"
        set ip 192.168.5.1 255.255.255.0
        set allowaccess ping
        set description "LAN-GUEST"
        set interface "port3"
        set vlanid 50
    next
    edit "loopback0"
        set vdom "root"
        set ip 10.255.0.5 255.255.255.255
        set type loopback
    next
end
config system dns
    set primary 8.8.8.8
    set secondary 1.1.1.1
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "192.168.1.10"
        next
    end
end
config log syslogd setting
    set status enable
    set server "192.168.1.50"
end
config system snmp sysinfo
    set status enable
    set location "Jakarta-DC1"
    set contact-info "noc@lab.local"
end
config system snmp community
    edit 1
        set name "public"
    next
end
config firewall policy
    edit 1
        set name "LAN-to-WAN"
        set srcintf "vlan50"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
end
config router prefix-list
    edit "NM-POLICY-SAMPLE"
        config rule
            edit 1
                set prefix 192.168.5.0 255.255.255.0
            next
        end
    next
    edit "GUEST-NETS"
        config rule
            edit 10
                set action permit
                set prefix 192.168.5.0 255.255.255.0
            next
            edit 20
                set action permit
                set prefix 192.168.50.0 255.255.254.0
                set le 24
            next
        end
    next
end
config router route-map
    edit "TO-R4"
        config rule
            edit 10
                set match-ip-address "GUEST-NETS"
                set set-metric 40
                set set-community "65005:50"
                set set-community-additive enable
            next
        end
    next
end
config router static
    edit 1
        set gateway 10.0.45.1
        set device "port1"
        set comment "DEFAULT"
    next
    edit 2
        set dst 10.99.0.0 255.255.255.0
        set gateway 10.0.56.2
        set distance 150
        set device "port2"
    next
    edit 3
        set dst 172.16.0.0 255.255.0.0
        set blackhole enable
    next
end
config router ospf
    set router-id 10.255.0.5
    set passive-interface "vlan50"
    config area
        edit 0.0.0.0
        next
    end
    config network
        edit 1
            set prefix 10.255.0.5 255.255.255.255
        next
        edit 2
            set prefix 10.0.45.0 255.255.255.252
        next
        edit 3
            set prefix 10.0.56.0 255.255.255.252
        next
        edit 4
            set prefix 192.168.5.0 255.255.255.0
        next
    end
    config redistribute "static"
        set status enable
    end
end
config router bgp
    set as 65005
    set router-id 10.255.0.5
    config neighbor
        edit "10.0.45.1"
            set remote-as 65004
            set description "EBGP-R4"
            set route-map-out "TO-R4"
        next
    end
    config network
        edit 1
            set prefix 192.168.5.0 255.255.255.0
        next
    end
end
