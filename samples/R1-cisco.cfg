!
version 15.7
service timestamps debug datetime msec
!
hostname R1-CISCO
!
ip domain name lab.local
ip name-server 8.8.8.8 1.1.1.1
!
username admin privilege 15 secret 5 $1$synthetic$hash
!
vlan 10
 name USERS
!
interface Loopback0
 description ROUTER-ID
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description TO-R2-JUNIPER
 ip address 10.0.12.1 255.255.255.252
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/1
 description TO-R10-ARUBA
 ip address 10.0.101.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description TO-R6-ARISTA
 ip address 10.0.16.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description TO-ISP
 ip address 203.0.113.2 255.255.255.252
 ip access-group 110 in
 service-policy output WAN-OUT
 no shutdown
!
interface GigabitEthernet0/4
 description LAN-TRUNK
 no ip address
 no shutdown
!
interface GigabitEthernet0/4.10
 description LAN-USERS
 encapsulation dot1Q 10
 ip address 192.168.1.1 255.255.255.0
 ip access-group MGMT-ONLY in
 service-policy input LAN-IN
!
interface GigabitEthernet0/5
 description UNUSED
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.0.1
 passive-interface GigabitEthernet0/4.10
 network 10.255.0.1 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.101.0 0.0.0.3 area 0
 network 10.0.16.0 0.0.0.3 area 0
 network 192.168.1.0 0.0.0.255 area 0
 redistribute static subnets route-map STATIC-TO-OSPF
 default-information originate
!
router bgp 65001
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 neighbor 203.0.113.1 remote-as 64500
 neighbor 203.0.113.1 description ISP-UPLINK
 neighbor 203.0.113.1 route-map ISP-IN in
 neighbor 203.0.113.1 route-map ISP-OUT out
 neighbor 10.255.0.2 remote-as 65001
 neighbor 10.255.0.2 description IBGP-R2
 neighbor 10.255.0.2 update-source Loopback0
 neighbor 10.255.0.2 next-hop-self
 network 192.168.1.0 mask 255.255.255.0
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1 name DEFAULT
ip route 172.16.0.0 255.255.0.0 Null0
ip route 10.99.0.0 255.255.255.0 10.0.12.2 150
!
ip access-list extended MGMT-ONLY
 remark SSH dari LAN saja
 permit tcp 192.168.1.0 0.0.0.255 any eq 22
 permit tcp host 192.168.1.50 10.255.0.0 0.0.255.255 eq 22 443
 permit udp any any range 33434 33534
 permit icmp any any
 deny ip any any log
!
ip access-list standard SNMP-HOSTS
 permit 192.168.1.50
 permit 10.10.0.0 0.0.255.255
!
access-list 110 permit tcp any host 203.0.113.2 eq 179
access-list 110 permit tcp any any established
access-list 110 deny ip 10.0.0.0 0.255.255.255 any
access-list 110 permit ip any any
!
ip access-list extended SCAVENGER-ACL
 permit tcp any any range 6881 6889
 permit udp any any eq 6881
!
ip prefix-list LAN-OUT seq 5 deny 192.168.1.128/25
ip prefix-list LAN-OUT seq 10 permit 192.168.0.0/16 ge 24 le 24
ip prefix-list DEFAULT-ONLY seq 5 permit 0.0.0.0/0
ip prefix-list BOGONS seq 5 permit 10.0.0.0/8 le 32
ip prefix-list BOGONS seq 10 permit 172.16.0.0/12 le 32
ip community-list standard CUST permit 65001:100
ip community-list standard CUST permit 65001:200
!
route-map ISP-OUT permit 10
 match ip address prefix-list LAN-OUT
 set as-path prepend 65001 65001
 set community 65001:500 additive
 set metric 50
route-map ISP-OUT deny 20
!
route-map ISP-IN deny 5
 match ip address prefix-list BOGONS
route-map ISP-IN permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 200
route-map ISP-IN permit 20
 match community CUST
 set local-preference 150
 set weight 100
!
route-map STATIC-TO-OSPF permit 10
 match tag 99
 set metric 20
 set tag 5
!
class-map match-any VOICE
 match dscp ef
class-map match-any VIDEO
 match dscp af41 af42
class-map match-all SCAVENGER
 match access-group name SCAVENGER-ACL
!
policy-map WAN-OUT
 class VOICE
  priority 2000
 class VIDEO
  bandwidth 4000
 class SCAVENGER
  set dscp cs1
  police cir 512000 conform-action transmit exceed-action drop
 class class-default
  shape average 20000000
!
policy-map LAN-IN
 class VOICE
  set dscp ef
 class SCAVENGER
  police cir 256000 conform-action transmit exceed-action drop
!
logging host 192.168.1.50
snmp-server community public RO
snmp-server location Jakarta-DC1
snmp-server contact noc@lab.local
ntp server 192.168.1.10
!
line vty 0 4
 transport input ssh
!
end
