!
!Version ArubaOS-CX FL.10.13.1000
!export-password: default
hostname R10-ARUBA
user admin group administrators password ciphertext AQBsynthetic
ip dns domain-name lab.local
ip dns server-address 8.8.8.8
ntp server 192.168.1.10
ntp enable
logging 192.168.1.50
snmp-server community public
snmp-server system-location Jakarta-DC1
snmp-server system-contact noc@lab.local
!
ssh server vrf mgmt
ip prefix-list NM-POLICY-SAMPLE seq 10 permit 192.168.10.0/24
ip prefix-list MGMT-NETS seq 10 permit 192.168.10.0/24
route-map STATIC-OUT permit seq 10
    match ip address prefix-list MGMT-NETS
    set metric 70
access-list ip MGMT-IN
    10 comment izinkan ssh dan snmp
    10 permit tcp 192.168.1.0/255.255.255.0 any eq 22
    20 permit udp 192.168.1.50 any eq 161
    30 deny any any any log
class ip MGMT-VOICE
    10 match any any any dscp 46
policy MGMT-POLICY
    10 class ip MGMT-VOICE action dscp 46 action local-priority 7
vlan 1
vlan 100
    name MANAGEMENT
interface mgmt
    no shutdown
    ip dhcp
interface 1/1/1
    description TO-R9-VYOS
    no shutdown
    routing
    ip address 10.0.90.2/30
    ip ospf 1 area 0.0.0.0
    ip ospf cost 40
interface 1/1/2
    description TO-R1-CISCO
    no shutdown
    routing
    ip address 10.0.101.1/30
    ip ospf 1 area 0.0.0.0
interface 1/1/3
    description PC-MGMT
    no shutdown
    no routing
    vlan access 100
interface 1/1/4
    description UPLINK-SW
    no shutdown
    no routing
    vlan trunk native 1
    vlan trunk allowed 100,101-102
interface 1/1/5
    description UNUSED
    shutdown
interface loopback 0
    ip address 10.255.0.10/32
    ip ospf 1 area 0.0.0.0
interface vlan 100
    description LAN-MANAGEMENT
    ip address 192.168.10.1/24
    apply access-list ip MGMT-IN in
    apply policy MGMT-POLICY in
    ip ospf 1 area 0.0.0.0
    ip ospf passive
ip route 0.0.0.0/0 10.0.101.2
ip route 10.99.0.0/24 10.0.90.1 distance 150
ip route 172.16.0.0/16 nullroute
router ospf 1
    router-id 10.255.0.10
    area 0.0.0.0
    redistribute static route-map STATIC-OUT
https-server vrf mgmt
